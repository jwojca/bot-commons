[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bot-commons"
version = "0.2.1"
description = "Sdílená logika napříč Telegram boty (přepis hlasu přes Whisper/Gemini, výpočet ceny tokenů, JSON parsing, env/logging helpery)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
config = [
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["bot_commons"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
